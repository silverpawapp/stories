<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#edf0f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1221" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英語でおはなし">
<title>英語で読むおはなし</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="backBtn" class="topbtn" type="button" hidden>＜ メニュー</button>
    <div id="where">英語で読むおはなし</div>
    <span class="topbtn ghost" aria-hidden="true"></span>
  </header>
  <main id="main" tabindex="-1"></main>
</div>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetWord">
  <div class="sheet-box">
    <div class="sheet-head">
      <div id="sheetWord" class="sheet-word"></div>
      <button id="sheetClose" class="topbtn" type="button" aria-label="とじる">とじる</button>
    </div>
    <div id="sheetBase" class="sheet-base"></div>
    <div id="sheetMean" class="sheet-mean"></div>
  </div>
</div>
<div id="update" class="update" hidden>
  <span>新しい版があります。</span>
  <button id="updateBtn" type="button">開き直す</button>
</div>
<noscript>このアプリを使うには、JavaScriptをオンにしてください。</noscript>
<script src="app.js"></script>
</body>
</html>
